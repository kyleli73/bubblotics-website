<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bubblotics Scouting has moved</title>
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://scouting.bubblotics.ca/" />
    <!-- Fallback for a browser with scripts off: go after three seconds. -->
    <meta http-equiv="refresh" content="3; url=https://scouting.bubblotics.ca/" />
    <script>
      // The scouting app lives at scouting.bubblotics.ca now. Unregister any
      // service worker the old copy left under /scout/ (see sw.js here), then
      // forward, keeping the #/route so an old deep link lands in the same
      // screen of the new app.
      (function () {
        var target = 'https://scouting.bubblotics.ca/' + location.hash;
        var go = function () { location.replace(target); };
        if (!('serviceWorker' in navigator)) return go();
        navigator.serviceWorker
          .getRegistrations()
          .then(function (regs) {
            return Promise.all(
              regs
                .filter(function (r) { return r.scope.indexOf('/scout/') !== -1; })
                .map(function (r) { return r.unregister(); })
            );
          })
          .then(go, go);
      })();
    </script>
  </head>
  <body style="font-family: system-ui, sans-serif; padding: 2rem">
    <p>
      The scouting app has moved to
      <a href="https://scouting.bubblotics.ca/">scouting.bubblotics.ca</a>.
    </p>
  </body>
</html>
