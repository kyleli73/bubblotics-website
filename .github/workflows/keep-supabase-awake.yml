# Keeps the team's Supabase project from being paused.
#
# The free plan pauses a project after 7 days without real database activity,
# and a paused project takes down the scouting app and this site's newsletters.
# This job calls keepalive(), a one-row database write set up by
# supabase/04-keepalive.sql in the scouting app's folder.
#
# It runs on GitHub's servers once a day, so it keeps going when nobody's
# computer is on. If the call fails (most likely because the project is
# already paused), the job fails and GitHub emails whoever last edited this
# file. That email is the early warning: restore the project from the
# Supabase dashboard straight away.
#
# GitHub turns off scheduled jobs in a public repo after 60 days with no
# commits. Pushing the website now and then is enough to keep it on.

name: Keep Supabase awake

on:
  schedule:
    # 13:17 UTC every day, which is morning in Ontario. An odd minute avoids
    # the top-of-the-hour rush when GitHub delays scheduled jobs.
    - cron: '17 13 * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write to the database
        env:
          # The publishable key is public by design: it is in every page of
          # this site already, and the database rules decide what it can do.
          SUPABASE_URL: https://hhxwvxzlykycnuzkjccn.supabase.co
          SUPABASE_KEY: sb_publishable_J8GLgVOd2ZWr8SI3MduKoA_SOdMLcP6
        run: |
          curl --fail-with-body -sS -m 30 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
